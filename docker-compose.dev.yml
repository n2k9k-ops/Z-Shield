# Environnement de développement uniquement. Les mots de passe sont en clair
# ici volontairement : ce fichier ne doit jamais servir en production.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zshield
      POSTGRES_USER: zshield_migrator
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zshield_migrator -d zshield"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://zshield_app:devpassword@postgres:5432/zshield
      DATABASE_MIGRATION_URL: postgres://zshield_migrator:devpassword@postgres:5432/zshield
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      # Le frontend proxifie /api vers l'API : même origine pour le navigateur,
      # donc cookies SameSite=Lax et protection CSRF native conservées.
      ZSHIELD_API_ORIGIN: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
