# =============================================================================
# Environnement de développement local COMPLET — une seule commande :
#
#     docker compose -f docker-compose.dev.yml up --build
#
# Démarre, dans l'ordre et automatiquement :
#   postgres (sain) -> migrate (applique le schéma, puis s'arrête) -> api -> web
# Puis ouvre http://localhost:3000
#
# Les mots de passe et clés ci-dessous sont des valeurs de DÉV en clair,
# volontairement : ce fichier ne doit JAMAIS servir en production.
# =============================================================================
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zshield
      POSTGRES_USER: zshield_migrator
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zshield_migrator -d zshield"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applique les migrations UNE FOIS puis se termine. L'API attend sa réussite.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["npm", "run", "migrate"]
    environment:
      DATABASE_MIGRATION_URL: postgres://zshield_migrator:devpassword@postgres:5432/zshield
      DATABASE_URL: postgres://zshield_migrator:devpassword@postgres:5432/zshield
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      # --- DÉV UNIQUEMENT : ne jamais réutiliser ces valeurs en production ---
      NODE_ENV: development
      PORT: "4000"
      DATABASE_URL: postgres://zshield_app:devpassword@postgres:5432/zshield
      DATABASE_MIGRATION_URL: postgres://zshield_migrator:devpassword@postgres:5432/zshield
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:3000
      WEB_ORIGIN: http://localhost:3000
      SESSION_SECRET: dev-session-secret-change-me-0123456789abcdef
      # base64 de 32 octets (openssl rand -base64 32) — DÉV :
      ZSHIELD_CREDENTIAL_KEY: qFpeD/Pap61ouWzoan3Xx9gVXDtjMsjS3F1YulKq7LQ=
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      # Le frontend proxifie /api et /ws vers l'API : même origine pour le
      # navigateur, donc cookies SameSite=Lax et protection CSRF conservées.
      ZSHIELD_API_ORIGIN: http://api:4000
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
