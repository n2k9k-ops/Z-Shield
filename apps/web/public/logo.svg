<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Z-Shield">
  <defs>
    <linearGradient id="zm" x1="40" y1="40" x2="210" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe8f2"/>
