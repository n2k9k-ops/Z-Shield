# =============================================================================
# Z-Shield Dashboard — Blueprint Render (Postgres + Redis + API + Web)
# Déploie toute la chaîne dashboard en une fois. Render > "New +" > "Blueprint",
# pointe sur ce dépôt : il lit ce fichier et crée les 4 ressources.
#
# ⚠️ Deux valeurs sont à saisir À LA MAIN (marquées sync:false) — Render les
#    demande au déploiement, elles ne peuvent pas être générées automatiquement :
#      - ZSHIELD_CREDENTIAL_KEY : openssl rand -base64 32   (32 octets base64)
#      - ZSHIELD_API_ORIGIN     : l'URL de l'API (ex. https://zshield-api.onrender.com),
#                                 à coller une fois l'API créée.
#
# NB : si l'UI Render affiche « Key Value » au lieu de « Redis », remplace
#      `type: redis` par `type: keyvalue` (même effet). Vérifie le nom exact
#      dans la doc Render si le déploiement du bloc redis échoue.
# =============================================================================

databases:
  - name: zshield-db
    databaseName: zshield
    plan: free                 # passe en 'starter'+ pour la prod
    postgresMajorVersion: "16"

services:
  # --- Cache / Redis --------------------------------------------------------
  - type: redis
    name: zshield-redis
    plan: free                 # passe en payant pour la persistance/prod
    ipAllowList: []            # [] = accessible uniquement via le réseau privé Render
    maxmemoryPolicy: noeviction

  # --- API (Fastify, TypeScript exécuté par Node 22) ------------------------
  - type: web
    name: zshield-api
    runtime: node
    plan: starter              # 'free' possible pour tester (s'endort)
    rootDir: .                 # racine = ce dossier (monorepo npm workspaces)
    buildCommand: npm install
    preDeployCommand: npm run migrate         # applique les migrations avant chaque déploiement
    startCommand: node --experimental-strip-types apps/api/src/server.ts
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: zshield-db
          property: connectionString
      - key: DATABASE_MIGRATION_URL          # sur Render, même URL (le rôle fourni fait le DDL ; la RLS est FORCÉE)
        fromDatabase:
          name: zshield-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: zshield-redis
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true                   # ≥ 32 caractères aléatoires : OK
      - key: ZSHIELD_CREDENTIAL_KEY           # DOIT être `openssl rand -base64 32` : à saisir
        sync: false
      - key: LICENSE_SIGNING_SECRET           # anti-vol : `openssl rand -base64 48` — MÊME valeur que `set zshield_license_secret` sur les serveurs clients
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAILS           # e-mail(s) admin plateforme, séparés par virgules — ces comptes voient l'onglet Admin, les autres non
        sync: false
      - key: ALLOW_REGISTRATION               # "true" le temps de créer un compte, puis retire-la / "false"
        sync: false
      - key: CORS_ORIGINS                     # l'origine publique du web (le proxy Next passe par le serveur, mais on la déclare)
        sync: false
      - key: WEB_ORIGIN
        sync: false

  # --- Web (Next.js) — c'est l'URL que tes utilisateurs ouvrent -------------
  - type: web
    name: zshield-web
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm install && npm run build --workspace @zshield/web
    startCommand: npx --workspace @zshield/web next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: ZSHIELD_API_ORIGIN              # URL de l'API (le serveur Next proxifie /api et /ws vers elle)
        sync: false
